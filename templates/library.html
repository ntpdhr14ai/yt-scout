<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Scout — Library</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424; --border: #333;
      --accent: #ff0000; --text: #e8e8e8; --muted: #888;
      --green: #22c55e; --yellow: #eab308; --radius: 8px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header h1 span { color: var(--accent); }
    header a { margin-left: auto; color: var(--text); text-decoration: none; border: 1px solid var(--border); padding: 8px 14px; border-radius: var(--radius); }
    .stats { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
    .filters select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; min-width: 170px; }
    .filters .check { flex-direction: row; align-items: center; gap: 6px; color: var(--text); padding-bottom: 8px; }
    .btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .count { margin-left: auto; color: var(--muted); font-size: 0.85rem; padding-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; font-size: 0.85rem; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { background: var(--surface2); color: var(--muted); font-weight: 600; white-space: nowrap; }
    td a { color: var(--text); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .tag { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; margin: 1px 2px 1px 0; font-size: 0.75rem; }
    .stale { color: var(--yellow); font-size: 0.75rem; }
    .muted { color: var(--muted); }
    .empty, .error { padding: 32px; text-align: center; color: var(--muted); }
    .error { color: #f87171; }
  </style>
</head>
<body>

<header>
  <h1>YT <span>Scout</span> · Library</h1>
  <a href="/">← Back to search</a>
</header>

<div class="stats" id="stats">Loading…</div>

<div class="filters">
  <label>Keyword
    <select id="keyword"><option value="">All keywords</option></select>
  </label>
  <label>Category
    <select id="category">
      <option value="">All categories</option>
      <option>Autos &amp; Vehicles</option><option>Comedy</option><option>Education</option>
      <option>Entertainment</option><option>Film &amp; Animation</option><option>Gaming</option>
      <option>Howto &amp; Style</option><option>Music</option><option>News &amp; Politics</option>
      <option>Nonprofits &amp; Activism</option><option>People &amp; Blogs</option>
      <option>Pets &amp; Animals</option><option>Science &amp; Technology</option>
      <option>Sports</option><option>Travel &amp; Events</option>
    </select>
  </label>
  <label>Subscribers
    <select id="tier">
      <option value="any">Any</option>
      <option value="under_5k">Under 5,000</option>
      <option value="5k_10k">5,001 – 10,000</option>
      <option value="10k_100k">10,001 – 100,000</option>
      <option value="100k_500k">100,001 – 500,000</option>
      <option value="500k_1m">500,001 – 1,000,000</option>
      <option value="over_1m">Over 1,000,000</option>
    </select>
  </label>
  <label class="check"><input type="checkbox" id="thOnly" checked /> Thailand only</label>
  <a class="btn" id="exportBtn" href="#">Export CSV</a>
  <span class="count" id="count"></span>
</div>

<div id="tableWrap"></div>

<script>
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = v => (v === null || v === undefined) ? '<span class="muted">—</span>' : Number(v).toLocaleString();
  let keywordsLoaded = false;

  function query() {
    const p = new URLSearchParams({
      keyword: $('keyword').value, category: $('category').value,
      tier: $('tier').value, th_only: $('thOnly').checked ? '1' : '0',
    });
    return p.toString();
  }

  async function load() {
    const q = query();
    $('exportBtn').href = '/library/export/csv?' + q;
    let data;
    try {
      const resp = await fetch('/library/data?' + q);
      data = await resp.json();
      if (!resp.ok) throw new Error(data.error || resp.statusText);
    } catch (e) {
      $('tableWrap').innerHTML = `<div class="error">${esc(e.message)}</div>`;
      $('stats').textContent = '';
      return;
    }

    const s = data.stats;
    $('stats').textContent =
      `${s.checked} channels checked · ${s.complete} with full data · ` +
      `${s.rejected_early} rejected early (kept so they are not re-checked) · ${s.keywords.length} keywords`;

    if (!keywordsLoaded) {
      for (const k of s.keywords) {
        const o = document.createElement('option');
        o.value = k; o.textContent = k;
        $('keyword').appendChild(o);
      }
      keywordsLoaded = true;
    }

    $('count').textContent = `${data.rows.length} shown`;
    if (!data.rows.length) {
      $('tableWrap').innerHTML = '<div class="empty">No channels match these filters yet. Run a search to grow the library.</div>';
      return;
    }

    const rows = data.rows.map(r => `
      <tr>
        <td><a href="${esc(r.url || ('https://www.youtube.com/@' + r.handle))}" target="_blank" rel="noopener">${esc(r.name || r.handle)}</a>
            <br><span class="muted">@${esc(r.handle)}</span></td>
        <td class="num">${num(r.subs)}</td>
        <td>${esc(r.location_badge || '?')}</td>
        <td>${esc(r.category || '—')}</td>
        <td class="num">${num(r.upload_frequency)}<br><span class="muted">${r.metrics_days ? 'last ' + r.metrics_days + 'd' : ''}</span></td>
        <td class="num">${num(r.avg_views_videos)}</td>
        <td class="num">${num(r.avg_views_shorts)}</td>
        <td class="num">${num(r.avg_views_live)}</td>
        <td class="num"><b>${num(r.score)}</b></td>
        <td>${(r.keywords || []).map(k => `<span class="tag">${esc(k)}</span>`).join('')}</td>
        <td style="white-space:nowrap">${esc((r.checked_at || '').slice(0, 10))}${r.stale ? '<br><span class="stale" title="Older than 14 days. Refreshed automatically when a search finds this channel again.">stale</span>' : ''}</td>
        <td>${(r.emails || []).map(e => `<a href="mailto:${esc(e)}">${esc(e)}</a>`).join('<br>') || '<span class="muted">—</span>'}</td>
      </tr>`).join('');

    $('tableWrap').innerHTML = `
      <table>
        <thead><tr>
          <th>Channel</th><th class="num">Subscribers</th><th>Location</th><th>Category</th>
          <th class="num">Uploads</th><th class="num">Avg Views Videos</th><th class="num">Avg Views Shorts</th>
          <th class="num">Avg Views Live</th><th class="num">Score</th><th>Found by keyword</th>
          <th>Checked</th><th>Contact</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  for (const id of ['keyword', 'category', 'tier', 'thOnly']) $(id).addEventListener('change', load);
  load();
</script>
</body>
</html>
